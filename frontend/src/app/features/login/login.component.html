<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>TNB Microservices</h1>
      <p>Hesabınıza giriş yapın</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Kullanıcı adınızı girin"
          [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
        <span class="error-text" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Kullanıcı adı zorunludur.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Şifrenizi girin"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <span class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Şifre zorunludur.
        </span>
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Giriş Yap</span>
        <span *ngIf="loading">Giriş yapılıyor...</span>
      </button>
    </form>
  </div>
</div>
